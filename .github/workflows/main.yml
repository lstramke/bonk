name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

concurrency:
  group: bonk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install raylib on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libraylib-dev

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Odin tests
        run: odin test src

  build-macos:
    name: Build macOS DMG
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Odin and raylib
        run: |
          brew update
          brew install odin raylib

      - name: Build application
        run: |
          mkdir -p bin
          odin build src -out:bin/bonk -o:speed

      - name: Create application bundle
        run: |
          app="dist/bonk.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp bin/bonk "$app/Contents/MacOS/bonk"
          cp -R assets/. "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>B.O.N.K.</string>
              <key>CFBundleExecutable</key>
              <string>bonk</string>
              <key>CFBundleIdentifier</key>
              <string>com.bonk.game</string>
              <key>CFBundleName</key>
              <string>B.O.N.K.</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_SHA}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
          </dict>
          </plist>
          PLIST
          chmod +x "$app/Contents/MacOS/bonk"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/bonk.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "B.O.N.K. ${GITHUB_REF_NAME}" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            "dist/bonk-${GITHUB_REF_NAME}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: bonk-${{ github.ref_name }}-dmg
          path: dist/bonk-${{ github.ref_name }}.dmg
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v8
        with:
          name: bonk-${{ github.ref_name }}-dmg
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
